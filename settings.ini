[DEFAULT]
# All sections below are required unless otherwise specified.
# See https://github.com/AnswerDotAI/nbdev/blob/main/settings.ini for examples.

### Python library ###
repo = Elastic
lib_name = elastic
version = 6.0.0
min_python = 3.7
license = GPLv3
black_formatting = False

### nbdev ###
doc_path = _docs
lib_path = elastic
nbs_path = nbs
recursive = True
tst_flags = notest
put_version_in_init = True

### Docs ###
branch = master
custom_sidebar = False
doc_host = https://%(user)s.github.io
doc_baseurl = /%(repo)s
git_url = https://github.com/%(user)s/%(repo)s
title = %(lib_name)s

### PyPI ###
audience = Users
author = Pawel T. Jochym
author_email = pawel.jochym@ifj.edu.pl
copyright = 2025 onwards, %(author)s
description = A module for ASE for elastic constants calculation.
keywords = physics science ase 'elastic constants' crystals
language = English
status = 3
user = jochym

### Optional ###
requirements = fastcore ase spglib>=2.5.0 numpy scipy click setuptools_scm
dev_requirements = nbdev
console_scripts = elastic.cli:elastic
conda_user = jochym
